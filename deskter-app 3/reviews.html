<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>deskter · Verified reviews</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f9fc;color:#161f33;font:15px system-ui,sans-serif}header{padding:22px 5%;background:white;border-bottom:1px solid #dfe6f1;display:flex;justify-content:space-between}main{max-width:780px;padding:30px 20px;margin:auto}a{color:#665df5}.card{background:white;border:1px solid #dfe6f1;border-radius:15px;padding:22px;margin:16px 0}.stars{font-size:22px;color:#665df5}.muted{color:#687890}.error{color:#a31b30}textarea,select{display:block;width:100%;border:1px solid #dfe6f1;border-radius:8px;padding:12px;font:inherit;margin:9px 0 16px}textarea{min-height:120px}button{border:0;background:#665df5;color:white;padding:12px 20px;border-radius:8px;cursor:pointer}button:disabled{opacity:.5}.body{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}</style></head><body><header><strong>deskter / Reviews</strong><a href="/app">← Discover</a></header><main><h1>Verified buyer reviews</h1><p id="status" role="status">Loading…</p><section class="card" id="editor"><h2>Leave a review</h2><p class="muted">Only buyers with a paid order can post. You can revise your review later.</p><form id="form"><label>Stars<select name="rating" required><option value="5">★★★★★ 5</option><option value="4">★★★★☆ 4</option><option value="3">★★★☆☆ 3</option><option value="2">★★☆☆☆ 2</option><option value="1">★☆☆☆☆ 1</option></select></label><label>How was your experience?<textarea name="body" minlength="10" maxlength="1000" required></textarea></label><button>Save review</button><p id="error" class="error" role="alert"></p></form></section><div id="list"></div></main><script>
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const listing=new URLSearchParams(location.search).get('listing');
async function api(path,data){const r=await fetch('/api/'+path,{method:data?'POST':'GET',headers:{'Content-Type':'application/json'},body:data?JSON.stringify(data):undefined,credentials:'same-origin'});if(!r.headers.get('content-type')?.includes('application/json'))throw Error('Open through the Deskter server.');const v=await r.json();if(!r.ok)throw Error(v.error||'Could not load reviews');return v}
async function load(){try{const v=await api('reviews?listing_id='+encodeURIComponent(listing));$('status').textContent=v.count?`${v.average} / 5 · ${v.count} verified reviews`:'No reviews yet.';$('list').innerHTML=v.reviews.map(r=>`<section class="card"><strong>${esc(r.buyer_name)}</strong><span class="muted"> · Verified purchase</span><p class="stars" aria-label="${r.rating} out of 5 stars">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</p><p class="body">${esc(r.body)}</p></section>`).join('');try{const p=await api('my-purchases');$('editor').hidden=!p.purchases.some(x=>x.listing_id===Number(listing))}catch(e){$('editor').hidden=true}}catch(e){$('status').textContent=e.message;$('editor').hidden=true}}
$('form').onsubmit=async e=>{e.preventDefault();const btn=$('form').querySelector('button');btn.disabled=true;$('error').textContent='';try{const d=Object.fromEntries(new FormData($('form')));await api('reviews',{listing_id:Number(listing),rating:Number(d.rating),body:d.body});await load();$('status').textContent+=' Your review was saved.'}catch(e){$('error').textContent=e.message}finally{btn.disabled=false}};
load();
</script></body></html>
