id="modal"></dialog><div class="toast" role="status" id="toast"></div><script>

const PREVIEW=location.protocol==='file:'||(location.search||'').includes('preview=1');
let previewStorage=true,previewDB=null;
const PREVIEW_KEY='deskter-frontend-v3';
function previewSeed(){return {version:3,current:1,users:[{id:1,name:'Avery Lee',email:'avery@demo.invalid'},{id:2,name:'Jamie Cruz',email:'jamie@demo.invalid'},{id:3,name:'Maya Santos',email:'maya@demo.invalid'}],listings:[{id:1,owner:3,title:'Brand Identity Sprint',category:'Services',description:'A focused two-week brand identity project. Includes discovery, visual direction, a logo system, and a practical brand guide.',price:1250000,pricing:'starting_at',status:'published',created:1},{id:2,owner:1,title:'My first creative service',category:'Services',description:'Edit this draft to describe your offer, choose a price, and publish it to Discover.',price:250000,pricing:'one_time',status:'draft',created:2}],saves:[],follows:[],leads:[]}}
function previewInit(){if(previewDB)return;try{const raw=localStorage.getItem(PREVIEW_KEY);if(raw){const value=JSON.parse(raw);if(value.version!==3||!['users','listings','saves','follows','leads'].every(k=>Array.isArray(value[k])))throw Error('Invalid preview data');previewDB=value}else previewDB=previewSeed()}catch(e){previewStorage=false;previewDB=previewSeed()}}
function previewPersist(){try{localStorage.setItem(PREVIEW_KEY,JSON.stringify(previewDB));previewStorage=true}catch(e){previewStorage=false}}
function previewApi(path,data,method){previewInit();const db=previewDB,u=db.users.find(x=>x.id===db.current),copy=x=>JSON.parse(JSON.stringify(x));if(path==='state'){const listings=db.listings.filter(l=>l.status==='published'||l.owner===u?.id).map(l=>({...l,seller:db.users.find(x=>x.id===l.owner)?.name||'Creator'}));return copy({user:u||null,listings,saved:db.saves.filter(s=>s.user===u?.id&&db.listings.some(l=>l.id===s.id&&l.status==='published')).map(s=>s.id),following:db.follows.filter(s=>s.user===u?.id).map(s=>s.id),leads:db.leads.filter(a=>db.listings.some(l=>l.id===a.listing_id&&l.owner===u?.id)).map(a=>({...a,title:db.listings.find(l=>l.id===a.listing_id).title,buyer_name:db.users.find(x=>x.id===a.buyer).name})),sent:db.leads.filter(a=>a.buyer===u?.id).map(a=>({...a,title:db.listings.find(l=>l.id===a.listing_id).title,seller_name:db.users.find(x=>x.id===db.listings.find(l=>l.id===a.listing_id).owner).name}))})}
if(!u)throw Error('Choose a demo account first.');const id=data?.id,listing=db.listings.find(l=>l.id===id);
if(path==='listings'){if(data.id&&(!listing||listing.owner!==u.id))throw Error('You can edit only your own asset.');if(data.title.trim().length<3||data.description.trim().length<10)throw Error('Add a title of at least 3 characters and a description of at least 10.');if(!Number.isInteger(data.price)||data.price<0||data.price>100000000)throw Error('Invalid price');if(listing)Object.assign(listing,copy(data));else db.listings.push({...copy(data),id:Math.max(0,...db.listings.map(l=>l.id))+1,owner:u.id,created:Math.floor(Date.now()/1000)})}
else if(path==='save'||path==='follow'){const table=path==='save'?'saves':'follows';if(path==='save'&&(!listing||listing.status!=='published'))throw Error('Listing is not published');if(path==='follow'&&id===u.id)throw Error('Choose another seller to follow');const index=db[table].findIndex(s=>s.user===u.id&&s.id===id);if(index>=0)db[table].splice(index,1);else db[table].push({user:u.id,id})}
else if(path==='leads'&&method==='PATCH'){const lead=db.leads.find(l=>l.id===id&&db.listings.some(x=>x.id===l.listing_id&&x.owner===u.id));if(!lead)throw Error('Inquiry not accessible');lead.status=data.status}
else if(path==='leads'){if(!listing||listing.status!=='published'||listing.owner===u.id)throw Error('Choose another seller’s published asset');if(data.message.trim().length<10)throw Error('Please include at least 10 characters');db.leads.push({id:Math.max(0,...db.leads.map(x=>x.id))+1,buyer:u.id,listing_id:id,message:data.message.trim(),status:'New',reply:'',created:Math.floor(Date.now()/1000)})}
else if(path==='reply'){const lead=db.leads.find(l=>l.id===id&&db.listings.some(x=>x.id===l.listing_id&&x.owner===u.id));if(!lead)throw Error('Inquiry not accessible');if(!data.reply.trim())throw Error('Enter a reply');lead.reply=data.reply.trim()}
else if(path==='profile'){if(data.name.trim().length<2)throw Error('Enter at least 2 characters');u.name=data.name.trim()}
else if(path==='logout'){db.current=null}
else throw Error('This action is not supported in local preview.');
previewPersist();return {ok:true}}
function previewAccount(){previewInit();openForm('Switch demo account',`<p class="muted">These are simulated accounts. Use Avery to publish, Jamie to inquire, and switch back to reply.</p><label class="field">Account<select name="user">${previewDB.users.map(u=>`<option value="${u.id}" ${u.id===previewDB.current?'selected':''}>${esc(u.name)}</option>`).join('')}</select></label>`,async d=>{previewDB.current=Number(d.user);previewPersist()},'','Switch account')}

const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const categories=['Services','Products','Courses','SaaS','Startups','Businesses','Agencies'];const groups=[['DISCOVERY',['Discover','Following']],['GROWTH',['Deskter Ads','Campaigns','Analytics']],['BUSINESS',['Assets','Leads']],['ACCOUNT',['Saved','Profile','Settings']],['ADMIN',['Admin Center']]];const icons=['⌕','♧','↗','▤','▥','▣','◉','♡','◎','⚙','◇'];
let state={listings:[],saved:[],following:[],leads:[],sent:[],user:null},view='Discover',category='All',query='',sort='For You',max=Infinity,timer;
async function api(path,data,method='POST'){
if(PREVIEW)return previewApi(path,data,method);
const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),15000);
try{const r=await fetch('/api/'+path,{method:data===undefined?'GET':method,headers:{'Content-Type':'application/json'},body:data===undefined?undefined:JSON.stringify(data),signal:controller.signal});
if(!r.headers.get('content-type')?.includes('application/json'))throw Error('This page is not connected to the Deskter server. Start python3 server.py and open its forwarded port.');
const value=await r.json();if(!r.ok){const error=Error(value.error||'Request failed');error.status=r.status;throw error}return value;
}catch(error){if(error.name==='AbortError')throw Error('The server took too long. Your form is still here. Check the connection before retrying.');if(error instanceof TypeError)throw Error('Cannot reach the server. Your form has been kept; reconnect and try again.');throw error}finally{clearTimeout(timeout)}}
function toast(s){$('toast').textContent=s;$('toast').style.display='block';clearTimeout(timer);timer=setTimeout(()=>$('toast').style.display='none',4000)}
async function load(){try{state=await api('state');render();return true}catch(e){$('main').innerHTML='<h1>Unable to load Deskter</h1><p class="error">'+esc(e.message)+'</p><button class="btn" onclick="load()">Retry</button>';return false}}
function go(v,nextCategory='All'){view=v;category=nextCategory;query='';max=Infinity;document.querySelector('.sidebar').classList.remove('open');render()}
function render(){let k=0;$('sidebar').innerHTML=groups.map(([g,vs])=>`<div class="group"><div class="label">${g}</div>${vs.map(v=>`<button class="nav ${view===v?'active':''}" title="${['Admin Center'].includes(v)?'Not available yet':v}" onclick="go('${v}')"><span>${icons[k++]}</span>${v}${['Admin Center'].includes(v)?'<small class="soon">Soon</small>':''}</button>`).join('')}</div>`).join('')+'<div class="pro"><small>DESKTER PRO</small><p>Advanced analytics and bulk listing tools</p><a class="btn" href="/growth#pro">Explore Pro</a></div>';
$('breadcrumb').textContent=view;$('savedCount').textContent=state.saved.length;$('account').textContent=state.user?state.user.name:'Sign in';
const sellers=[...new Map(state.listings.filter(l=>l.status==='published'&&l.owner!==state.user?.id).map(l=>[l.owner,l])).values()];$('people').innerHTML=sellers.map(l=>`<div class="person"><span class="avatar">${esc(l.seller[0])}</span><strong>${esc(l.seller)}</strong><button class="btn mini" onclick="toggle('follow',${l.owner})">${state.following.includes(l.owner)?'Following':'Follow'}</button></div>`).join('')||'<p class="muted">Creators appear here when they publish their first listing.</p>';
let heading=view==='Discover'?"What's worth your attention?":view;
$('main').innerHTML=`<div class="eyebrow">${view.toUpperCase()}</div><h1>${heading}</h1><p class="muted">Sell Anything. Promote Anything. Grow Anything.</p>${PREVIEW?`<div class="preview-notice"><span><strong>Local preview</strong> · ${previewStorage?'Saved in this browser':'Session only: browser storage unavailable'} · No real authentication or payments</span><button class="seller-link" onclick="previewAccount()">Switch account</button></div>`:''}<div id="content"></div><p class="foot">Deskter · ${PREVIEW?'Frontend preview':'Local development build'}</p>`;
if(['Discover','Saved','Following','Assets'].includes(view)){
$('content').innerHTML=`${!state.user&&view!=='Discover'?'<div class="notice">Sign in to use your personal workspace.</div>':''}<div class="searchrow"><input id="search" aria-label="Search marketplace" placeholder="Search products, services, businesses…" value="${esc(query)}"><button class="btn" onclick="document.querySelector('.filters').classList.toggle('open')">☷ Filters</button></div><div class="filters"><label>Maximum price (₱) <input type="number" min="0" id="priceFilter" value="${isFinite(max)?max/100:''}" placeholder="Any price"></label></div><p class="muted">Trending topics</p><div class="topics">${['All',...categories].map(c=>`<button class="chip ${c===category?'active':''}" onclick="category='${c}';render()">${c}</button>`).join('')}</div><div class="tabs">${['For You','New','Price: low to high'].map(t=>`<button class="tab ${sort===t?'active':''}" onclick="sort='${t}';render()">${t}</button>`).join('')}</div><div class="feedhead"><h2>${view==='Discover'?'Recommended for you':view==='Assets'?'Your assets':view}</h2><div><span class="muted" id="resultCount"></span> ${view==='Assets'?'<button class="btn primary mini" onclick="listingForm()">+ Create asset</button>':''}</div></div><div class="grid" id="grid"></div>`;
$('search').oninput=e=>{query=e.target.value;cards()};$('priceFilter').oninput=e=>{max=e.target.value===''?Infinity:Number(e.target.value)*100;cards()};cards();
}else if(['Deskter Ads','Campaigns'].includes(view)){$('content').innerHTML=PREVIEW?'<section class="panel"><h2>Growth workspace requires the server</h2><p>Open the integrated app to manage campaigns and boost requests.</p></section>':'<section class="panel"><h2>Campaigns and promotion</h2><p>Launch a campaign, report monthly revenue, or request a sponsored boost.</p><a class="btn primary" href="/growth">Open growth workspace</a></section>';
}else if(view==='Leads'){renderLeads();
}else if(view==='Analytics'){const own=state.listings.filter(l=>l.owner===state.user?.id&&l.status==='published');$('content').innerHTML=`<div class="stats">${[['Published assets',own.length],['Received inquiries',state.leads.length],['Open inquiries',state.leads.filter(l=>l.status!=='Closed').length]].map(([t,n])=>`<div class="panel">${t}<strong>${n}</strong></div>`).join('')}</div><p class="muted">Counts reflect your saved database records. Visits, revenue, and ad performance are not tracked yet.</p>`;
}else if(['Profile','Settings'].includes(view)){$('content').innerHTML=state.user?`<section class="panel"><h2>${esc(state.user.name)}</h2><p>${esc(state.user.email)}</p><p class="muted">Your seller name is shown on published listings. Email is visible only in your account.</p><button class="btn primary" onclick="editProfile()">Edit profile</button> ${!PREVIEW?'<button class="btn" onclick="changePassword()">Change password</button>':''} <button class="btn" onclick="logout()">Sign out</button></section>`:'<button class="btn primary" onclick="auth()">Sign in</button>';
}else{$('content').innerHTML=`<section class="panel"><h2>${view==='Admin Center'?'Moderation is not configured':view==='Deskter Ads'?'Campaign delivery is not connected':'No live campaigns yet'}</h2><p class="muted">${view==='Admin Center'?'This build does not grant administrative access. Protected moderation and reporting are a later milestone.':'Advertising requires approved pricing, budget accounting, campaign review, and delivery tracking. No payment or advertising promise is made by this build.'}</p></section>`}}
function cards(){let all=state.listings;let rows=all.filter(l=>(view==='Assets'||l.status==='published')&&(category==='All'||category===l.category)&&`${l.title} ${l.seller} ${l.description}`.toLowerCase().includes(query.toLowerCase())&&(l.pricing==='quote'?max===Infinity:l.price<=max)&&(view!=='Saved'||state.saved.includes(l.id))&&(view!=='Following'||state.following.includes(l.owner))&&(view!=='Assets'||l.owner===state.user?.id));if(sort==='Price: low to high')rows.sort((a,b)=>(a.pricing==='quote'?Infinity:a.price)-(b.pricing==='quote'?Infinity:b.price));if(sort==='New')rows.sort((a,b)=>b.id-a.id);$('resultCount').textContent=rows.length+' listings';let colors=['#5044eb,#823bf2','#009b70,#112232','#e88100,#652c32','#0398b2,#2563ec,#192f60'];$('grid').innerHTML=rows.map((l,i)=>`<article class="card"><div class="cover" style="background:linear-gradient(115deg,${colors[Math.abs(l.id)%4]})"><span class="badge">${l.status==='draft'?'DRAFT · ONLY YOU':l.status==='archived'?'ARCHIVED':l.sponsored?'SPONSORED':'PUBLISHED'}</span><div><small>${esc(l.category.toUpperCase())}</small><h3><button class="title-link" onclick="details(${l.id})">${esc(l.title)}</button></h3></div></div><div class="body"><span class="type">${esc(l.category)}</span><p class="desc">${esc(l.description)}</p><div class="seller"><span class="avatar">${esc(l.seller[0])}</span><button class="seller-link" onclick="storefront(${l.owner})">${esc(l.seller)}</button></div><div class="bottom"><strong>${priceLabel(l)}</strong><div>${l.status==='published'?`<button class="btn mini" onclick="toggle('save',${l.id})">${state.saved.includes(l.id)?'♥ Saved':'♡ Save'}</button>`:''} <button class="btn primary mini" onclick="${l.owner===state.user?.id?'listingForm':'inquiry'}(${l.id})">${l.owner===state.user?.id?'Edit':'Contact'}</button></div></div></div></article>`).join('')||'<div class="empty"><h2>No matching assets yet</h2><p>Create an asset or clear your filters to get started.</p><button class="btn primary" onclick="listingForm()">+ Create an asset</button> <button class="btn" onclick="query=\'\';category=\'All\';max=Infinity;render()">Clear filters</button></div>'}
let afterLogin=null;
let formBusy=false;
function openForm(title,fields,submit,extra='',buttonLabel='Continue'){
const m=$('modal');if(m.open)m.close();m.innerHTML=`<form><h2>${title}</h2>${fields}<p class="error" role="alert" tabindex="-1"></p>${extra}<div class="dialog-actions"><button type="button" class="btn" onclick="afterLogin=null;document.getElementById('modal').close()">Cancel</button><button class="btn primary" type="submit">${buttonLabel}</button></div></form>`;
const form=m.querySelector('form');form.addEventListener('invalid',e=>{m.querySelector('.error').textContent='Check '+(e.target.closest('label')?.childNodes[0]?.textContent.trim()||'the highlighted field')+': '+e.target.validationMessage},true);
form.onsubmit=async e=>{e.preventDefault();if(formBusy)return;formBusy=true;const values=Object.fromEntries(new FormData(form));if(e.submitter?.dataset.status)values.status=e.submitter.dataset.status;
const buttons=[...form.querySelectorAll('button')];buttons.forEach(b=>b.disabled=true);const b=e.submitter||form.querySelector('[type=submit]'),previous=b.textContent;b.textContent='Saving…';m.querySelector('.error').textContent='';
try{await submit(values);m.close();const refreshed=await load();if(refreshed&&afterLogin&&state.user){const next=afterLogin;afterLogin=null;next()}}catch(err){const box=m.querySelector('.error');box.textContent=err.message;box.focus()}finally{formBusy=false;buttons.forEach(b=>b.disabled=false);b.textContent=previous}};m.showModal()}
function field(label,name,type='text',value='',min=''){return `<label class="field">${label}<input name="${name}" type="${type}" value="${esc(value)}" required ${min}></label>`}
function auth(register=false){if(PREVIEW){previewAccount();return}openForm(register?'Create your account':'Welcome back',(register?field('Name','name','text','','minlength="2" maxlength="80"'):'')+field('Email','email','email')+field('Password (10+ characters)','password','password','','minlength="10" maxlength="128"'),d=>api(register?'register':'login',d),`<button class="btn" type="button" onclick="document.getElementById('modal').close();auth(${!register})">${register?'Already have an account?':'Create an account'}</button>`)}
function account(){PREVIEW?previewAccount():state.user?go('Profile'):auth()}
const priceModes={one_time:'One-time price',monthly:'Per month',yearly:'Per year',starting_at:'Starting at',quote:'Request a quote',free:'Free'};
function centavos(value){let input=String(value??'').trim().replace(/^(?:PHP\s*|₱\s*)/i,'');if(!/^(?:\d{1,7}|\d{1,3}(?:,\d{3}){1,2})(?:\.\d{1,2})?$/.test(input))throw Error('Enter an amount like 1250, 1,250.50, or ₱1,250.50. Use at most two decimal places.');const [whole,fraction='']=input.replaceAll(',','').split('.');const amount=Number(whole)*100+Number(fraction.padEnd(2,'0'));if(amount<1||amount>100000000)throw Error('Amount must be between ₱0.01 and ₱1,000,000. Choose Free if there is no charge.');return amount}
function priceLabel(l){const mode=l.pricing||'one_time';if(mode==='quote')return 'Request a quote';if(mode==='free')return 'Free';const n=new Intl.NumberFormat('en-PH',{style:'currency',currency:'PHP',minimumFractionDigits:l.price%100?2:0,maximumFractionDigits:2}).format(l.price/100);return (mode==='starting_at'?'From ':'')+n+(mode==='monthly'?' / month':mode==='yearly'?' / year':'')}
function pricingChanged(){const mode=$('modal').querySelector('[name=pricing]').value,input=$('modal').querySelector('[name=price]');input.disabled=['quote','free'].includes(mode);input.required=!input.disabled;input.closest('label').style.display=input.disabled?'none':'block';$('pricingHint').textContent=mode==='monthly'||mode==='yearly'?'This displays a recurring rate. Automatic billing is not connected.':mode==='quote'?'Customers contact you for a custom quote. No fixed amount is displayed.':mode==='free'?'Displayed as Free. File delivery is not connected.':'Displayed in PHP. Checkout for eligible one-time listings requires payment setup.'}
function listingForm(id){if(id&&!state.listings.some(l=>l.id===id&&l.owner===state.user?.id)){toast('Only the owner can edit this asset.');return}if(!state.user){afterLogin=()=>listingForm(id);auth();return}const l=state.listings.find(x=>x.id===id)||{};openForm(id?'Edit your asset':'Create an asset',`<p class="muted">Describe your offer, set clear pricing, then save a draft or publish it to Discover.</p>`+field('Asset title','title','text',l.title||'','minlength="3" maxlength="100"')+`<label class="field">Category<select name="category">${categories.map(c=>`<option ${l.category===c?'selected':''}>${c}</option>`).join('')}</select></label><label class="field">Description<textarea name="description" required minlength="10" maxlength="2000" placeholder="What is included? Who is this for? How will you deliver it?">${esc(l.description||'')}</textarea></label><div class="form-grid"><label class="field">Pricing model<select name="pricing" onchange="pricingChanged()">${Object.entries(priceModes).map(([key,label])=>`<option value="${key}" ${(l.pricing||'one_time')===key?'selected':''}>${label}</option>`).join('')}</select></label>`+field('Amount (PHP)','price','text',l.price===undefined?'':(l.price/100).toFixed(2),'inputmode="decimal" placeholder="e.g. 1250.50"')+`</div><p class="muted" id="pricingHint"></p><label class="field">Visibility<select name="status"><option value="draft" ${(l.status||'draft')==='draft'?'selected':''}>Draft — only you can see it</option><option value="published" ${l.status==='published'?'selected':''}>Published — visible in Discover</option>${id?`<option value="archived" ${l.status==='archived'?'selected':''}>Archived — hidden from discovery</option>`:''}</select></label>`,async d=>{const amount=['quote','free'].includes(d.pricing)?0:centavos(d.price);await api('listings',{...d,price:amount,...(id?{id}:{})});view='Assets';category='All';query='';max=Infinity;toast(d.status==='published'?'Asset published. It is now visible in Discover.':d.status==='draft'?'Draft saved. Publish it whenever you’re ready.':'Asset archived.')},'','Save changes');const actions=$('modal').querySelector('.dialog-actions');const primary=actions.querySelector('[type=submit]');if(!id){primary.textContent='Publish asset';primary.dataset.status='published';const draft=document.createElement('button');draft.type='submit';draft.className='btn';draft.textContent='Save draft';draft.dataset.status='draft';actions.insertBefore(draft,primary)}pricingChanged()}
function changePassword(){openForm('Change your password',field('Current password','current_password','password','','minlength="10" maxlength="128" autocomplete="current-password"')+field('New password','new_password','password','','minlength="10" maxlength="128" autocomplete="new-password"')+'<p class="muted">Your other signed-in sessions will be signed out.</p>',async d=>{await api('password',d);toast('Password changed. Other sessions have been signed out.')},'','Change password')}
function editProfile(){openForm('Edit profile',field('Display name','name','text',state.user.name,'minlength="2" maxlength="80"'),d=>api('profile',d),'','Save profile')}
async function toggle(type,id){if(id<0){toast('Example listing. Create an account and publish an asset to try the real workflow.');return}if(!state.user){afterLogin=()=>toggle(type,id);auth();return}try{await api(type,{id});await load()}catch(e){toast(e.message)}}
function inquiry(id){if(id<0){toast('This is an example listing, not a real seller.');return}if(!state.user){afterLogin=()=>inquiry(id);auth();return}openForm('Contact seller','<label class="field">Tell the seller what you need<textarea name="message" required minlength="10" maxlength="2000"></textarea></label>',async d=>{await api('leads',{id,...d});toast('Inquiry delivered to the seller’s Leads inbox.')})}
async function updateLead(id,status){try{await api('leads',{id,status},'PATCH');await load()}catch(e){toast(e.message);await load()}}async function logout(){try{await api('logout',{});view='Discover';afterLogin=null;await load()}catch(e){toast(e.message)}}
$('modal').addEventListener('cancel',e=>{if(formBusy)e.preventDefault();else afterLogin=null});
function renderLeads(){
const incoming=state.leads||[],sent=state.sent||[];
const entry=(l,inbox)=>`<article class="lead"><div class="lead-head"><strong>${esc(l.title)}</strong><span class="type">${esc(l.status)}</span></div><p class="muted">${inbox?'From '+esc(l.buyer_name):'To '+esc(l.seller_name)} · ${new Date(l.created*1000).toLocaleDateString()}</p><p>${esc(l.message)}</p>${l.reply?`<div class="reply"><strong>Seller response</strong><p>${esc(l.reply)}</p></div>`:''}${inbox?`<div class="lead-head"><label>Status <select aria-label="Inquiry status" onchange="updateLead(${l.id},this.value)">${['New','In progress','Closed'].map(s=>`<option ${l.status===s?'selected':''}>${s}</option>`).join('')}</select></label><button class="btn primary mini" onclick="replyForm(${l.id})">${l.reply?'Edit response':'Reply'}</button></div>`:''}</article>`;
$('content').innerHTML=state.user?'<h2>Received inquiries</h2>'+ (incoming.map(l=>entry(l,true)).join('')||'<div class="empty">Inquiries about your published assets will appear here.</div>')+'<h2>Sent inquiries</h2>'+(sent.map(l=>entry(l,false)).join('')||'<div class="empty">Contact a seller to start a conversation about their offer.</div>'):'<div class="empty"><p>Sign in to view your inquiries.</p><button class="btn primary" onclick="auth()">Sign in</button></div>';
}
function replyForm(id){const l=state.leads.find(x=>x.id===id);if(!l)return;openForm('Reply to inquiry',`<p class="muted">${esc(l.buyer_name)} · ${esc(l.title)}</p><label class="field">Your response<textarea name="reply" required maxlength="2000">${esc(l.reply||'')}</textarea></label>`,async d=>{await api('reply',{id,...d});toast('Response saved. The buyer can view it in Leads.')},'','Save response')}
function details(id){const l=state.listings.find(x=>x.id===id);if(!l){toast('This asset is no longer available.');return}const m=$('modal');if(m.open)m.close();m.innerHTML=`<span class="type">${esc(l.category)}</span><h2 style="margin-top:15px">${esc(l.title)}</h2><p class="muted">By ${esc(l.seller)} · ${esc(l.status)}</p><h2>${priceLabel(l)}</h2><div class="detail-copy">${esc(l.description)}</div><p class="muted">Contact the seller to arrange delivery. Eligible one-time offers can use test checkout. Delivery is arranged with the seller.</p><div class="dialog-actions"><button class="btn" onclick="document.getElementById('modal').close()">Close</button><button class="btn primary" onclick="document.getElementById('modal').close();${l.owner===state.user?.id?'listingForm':'inquiry'}(${l.id})">${l.owner===state.user?.id?'Edit asset':'Contact seller'}</button>${!PREVIEW&&l.owner!==state.user?.id&&l.status==='published'&&l.pricing==='one_time'&&['Products','Courses','Services'].includes(l.category)?`<a class="btn primary" href="/orders?listing=${l.id}">Test checkout</a>`:''}</div>`;m.showModal()}
function storefront(owner){const rows=state.listings.filter(l=>l.owner===owner&&l.status==='published');if(!rows.length){toast('This seller has no published assets.');return}const m=$('modal');if(m.open)m.close();m.innerHTML=`<h2>${esc(rows[0].seller)}</h2><p class="muted">${rows.length} published assets</p>${rows.map(l=>`<section class="panel"><button class="seller-link" onclick="details(${l.id})">${esc(l.title)}</button><p>${priceLabel(l)}</p></section>`).join('')}<div class="dialog-actions"><button class="btn" onclick="document.getElementById('modal').close()">Close</button></div>`;m.showModal()}

document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)&&$('search')){e.preventDefault();$('search').focus()}});if(!globalThis.__DESKTER_TEST__)load();
</script><script>
// Listing detail reviews are loaded from the same database as verified purchases.

details=function(id){showDetails(id);if(PREVIEW||typeof fetch!=='function')return;
const modal=$('modal');if(!modal.open)return;

  const link=document.createElement('a');link.href='/course?listing='+id;link.className='btn';link.textContent='Build course';modal.querySelector('.dialog-actions').append(link);

reviews.innerHTML='<h3>Verified buyer reviews</h3><p class="muted">'+(v.count?v.average+' / 5 · '+v.count+' reviews':'No reviews yet.')+'</p>'+
v.reviews.slice(0,3).map(r=>'<p><strong>'+esc(r.buyer_name)+'</strong> · '+('★'.repeat(r.rating))+'<br>'+esc(r.body)+'</p>').join('')+
'<a href="/reviews?listing='+id+'">Read all reviews or leave yours →</a>';
}).catch(()=>{if(reviews.isConnected)reviews.textContent='Reviews unavailable right now.'});
